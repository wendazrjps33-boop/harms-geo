version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: georank-postgres
    environment:
      POSTGRES_DB: georank
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - ../database/initial-data.sql:/docker-entrypoint-initdb.d/initial-data.sql:ro
    networks:
      - georank-network

  redis:
    image: redis:7-alpine
    container_name: georank-redis
    ports:
      - "6379:6379"
    networks:
      - georank-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: georank-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD}@postgres:5432/georank
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    depends_on:
      - postgres
      - redis
    networks:
      - georank-network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: georank-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - georank-network

networks:
  georank-network:
    driver: bridge

volumes:
  postgres_data: